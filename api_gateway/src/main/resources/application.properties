server.port=8080

spring.application.name=api-gateway
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true



eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

spring.cloud.gateway.routes[0].id=delivery-service
spring.cloud.gateway.routes[0].uri=lb://DELIVERY-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/deliveries/**
#spring.cloud.gateway.routes[0].filters[0]=JwtAuthenticationFilter


spring.cloud.gateway.routes[1].id=product-service
spring.cloud.gateway.routes[1].uri=lb://PRODUCT-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/products/**


spring.cloud.gateway.routes[2].id=order-service
spring.cloud.gateway.routes[2].uri=lb://ORDER-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/orders/**

spring.cloud.gateway.routes[3].id=payment-service
spring.cloud.gateway.routes[3].uri=lb://PAYMENT-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/payments/**





spring.cloud.gateway.routes[4].id=user-service
spring.cloud.gateway.routes[4].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/users/**, /auth/**
#spring.cloud.gateway.routes[4].filters[0]=JwtAuthenticationFilter



management.endpoints.web.exposure.include=*
management.endpoint.gateway.enabled=true
management.endpoints.enabled-by-default=true
management.endpoint.health.show-details=always


logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.boot.actuate=DEBUG




spring.cloud.loadbalancer.ribbon.enabled=false
spring.security.basic.enabled=false
management.security.enabled=false


spring.cloud.loadbalancer.configurations=default